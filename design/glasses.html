<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>问全·实时访谈助手 · 眼镜端设计预览</title>
<style>
:root { color-scheme:dark; font-family:"PingFang SC",sans-serif; background:#101517; color:#eef3f1 }
*{box-sizing:border-box} body{margin:0} main{max-width:1320px;margin:auto;padding:48px 44px 60px}
header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303b3c;padding-bottom:22px}
.brand{font-weight:600;font-size:22px;letter-spacing:3px} .edition{font-size:12px;color:#9aa8a6;letter-spacing:2px}
.intro{display:flex;align-items:end;justify-content:space-between;gap:32px;margin:42px 0 32px} h1{font-size:36px;font-weight:500;letter-spacing:-1px;margin:0 0 12px} p{font-size:14px;color:#a5b4b0;line-height:1.8;margin:0}
button{font:inherit;font-size:12px;background:transparent;color:#d4ded9;border:1px solid #4a5854;border-radius:24px;padding:10px 16px;white-space:nowrap;cursor:pointer}button:focus-visible{outline:2px solid #e5f9e9;outline-offset:4px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px} figure{margin:0} .surface{background:#000;border:1px solid #303b36;border-radius:16px;overflow:hidden;line-height:0}
canvas{display:block;width:100%;height:auto;filter:url(#phosphor)}body.white canvas{filter:none}
figcaption{display:flex;justify-content:space-between;align-items:center;padding:13px 2px;color:#d0dcd4;font-size:13px}figcaption span{color:#80918b;font-size:12px}
.note{border-top:1px solid #303b3c;margin-top:24px;padding-top:22px;font-size:12px;color:#80918b}
@media(max-width:760px){main{padding:28px 20px}.intro{display:block}button{margin-top:20px}.grid{grid-template-columns:1fr}h1{font-size:29px}.edition{letter-spacing:0}}
</style>
<svg width="0" height="0" aria-hidden="true" style="position:absolute"><filter id="phosphor" color-interpolation-filters="sRGB"><feColorMatrix type="matrix" values=".52 0 0 0 0  0 .94 0 0 0  0 0 .35 0 0  0 0 0 1 0"/></filter></svg>
<main>
<header><div class="brand">问全·实时访谈助手</div><div class="edition">GLASSES INTERFACE · 0.5.5</div></header>
<div class="intro"><div><h1>下一句怎么问，抬眼就有建议。</h1><p>开场看主线，回答后看追问。建议始终可选，节奏由你掌握。</p></div><button id="mode">切换为原始灰度</button></div>
<div class="grid">
<figure><div class="surface"><canvas id="short" aria-label="主线开场建议"></canvas></div><figcaption>主线建议<span>无语音也可显示 · 来自已确认提纲</span></figcaption></figure>
<figure><div class="surface"><canvas id="long" aria-label="原话追问建议"></canvas></div><figcaption>追问建议<span>根据嘉宾回答 · 均衡换行</span></figcaption></figure>
<figure><div class="surface"><canvas id="mixed" aria-label="转场建议"></canvas></div><figcaption>转场建议<span>下一条主线 · 由主持人选择</span></figcaption></figure>
<figure><div class="surface"><canvas id="quiet" aria-label="等待嘉宾回答"></canvas></div><figcaption>等待回答<span>不因沉默跳题 · 暂停和结束清屏</span></figcaption></figure>
</div>
<p class="note">使用产品实际绘制代码 · 原生画布 600 × 350 · 16 级灰度。绿色仅用于模拟发光效果，真实光学观感以设备为准。</p>
</main>
<script type="module">
import { drawHint, hintLines } from '../web/glass-ui.js';
const examples = [
 ['short',{text:'能用一个具体的使用场景介绍你们的项目吗？',source:'outline',guideKind:'main'},{chapter:'项目与演示',progress:'1/5',nextChapter:'痛点与起因'}],
 ['long',{hint:'换昵称重复统计怎么处理？',type:'deepen'},{chapter:'困难与攻克',progress:'4/5',nextChapter:'验证与下一步'}],
 ['mixed',{hint:'是什么具体经历让你们决定做这个项目？',type:'transition'},{chapter:'痛点与起因',progress:'2/5',nextChapter:'方案与取舍'}],
 ['quiet',{text:'能用一个具体的使用场景介绍你们的项目吗？',source:'outline'},{waiting:true,chapter:'项目与演示',progress:'1/5'}]
];
for(const [id,q,options] of examples)drawHint(document.getElementById(id),q,options);
document.getElementById('mode').onclick=()=>{document.body.classList.toggle('white');document.getElementById('mode').textContent=document.body.classList.contains('white')?'切换为模拟绿色':'切换为原始灰度'};
window.designReady=true;
</script>
</html>
