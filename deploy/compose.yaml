name: wenquan
services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: wenquan-gateway:0.4.0
    container_name: wenquan-gateway
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8788:8787"
    mem_limit: 256m
    cpus: 0.75
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health',{headers:{Authorization:'Bearer '+process.env.GATEWAY_TOKEN}}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
