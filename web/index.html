<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light"><title>问全·实时访谈助手</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header class="masthead"><a class="brand" href="#" aria-label="问全·实时访谈助手首页"><span class="brandmark">问</span><span>问全<span class="brand-subtitle">·实时访谈助手</span><small>留心听，问清楚。</small></span></a><span id="bridge-badge" class="badge">连接中</span></header>
  <nav class="navbar" aria-label="主要页面"><button class="nav-btn" data-view="topics" aria-label="访谈"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h14v12H9l-4 4V4Z"/><path d="M9 8h6M9 12h4"/></svg><span>访谈</span></button><button class="nav-btn" data-view="results" aria-label="记录"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h9l4 4v14H6V3Z"/><path d="M14 3v5h5M9 12h7M9 16h5"/></svg><span>记录</span></button><button class="nav-btn" data-action="settings" aria-label="设置"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3-.6 2.4-2.1 1.2L4 6l-2 3.5 1.7 1.8v2.4L2 15.5 4 19l2.3-.6 2.1 1.2L9 22h4l.6-2.4 2.1-1.2 2.3.6 2-3.5-1.7-1.8v-2.4L20 9l-2-3.5-2.3.6-2.1-1.2L13 3H9Z" transform="translate(1 -1) scale(.95)"/><circle cx="12" cy="12" r="3"/></svg><span>设置</span></button></nav>
  <main id="main"></main>
  <div id="toast" role="status" aria-live="polite"></div>
  <input id="audio-file-input" type="file" class="hidden" accept=".ogg,.wav,.mp3,.m4a,.mp4,.webm,.flac,audio/*" aria-label="导入音频文件">
  <dialog id="settings"><form id="settings-form"><div class="section-head"><h2>分析设置</h2><button type="button" id="close-settings" aria-label="关闭设置">✕</button></div><p class="muted">火山和文本模型密钥只保存在云端。手机独立连接，无需 Mac 开机。</p><details><summary>粘贴连接配置</summary><label>连接配置<input id="connection-profile" type="password" autocomplete="off" placeholder="粘贴管理员提供的完整 JSON"></label><button id="import-connection" type="button" class="small secondary">填入连接配置</button></details><label>分析方式<select name="mode"><option value="demo">离线脚本演示（固定结果）</option><option value="model">真实模型分析（需后端）</option></select></label><label>云端网关地址<input name="backend" type="url" required placeholder="https://你的域名/问全路径"></label><label>设备访问码<input name="access" type="password" autocomplete="off" maxlength="256" placeholder="管理员提供的网关访问码"></label><p class="fine">个人安装包已预置云端连接，可直接开始访谈。此处用于手动更换服务；修改不会进入访谈记录或导出。</p><p id="connection-origin" class="fine"></p><p class="fine">默认持续采集并发送到火山流式 ASR；稳定分句自动保存，交给文本模型分析。无需 App 本地 ASR。转写和分析均可人工更正。</p><div id="service-status" class="notice">尚未检测服务</div><div class="row"><button type="button" id="check-service" class="secondary">检测连接</button><button type="submit" class="primary">保存设置</button></div></form></dialog>
  <script type="module" src="./app.js"></script>
</body>
</html>
